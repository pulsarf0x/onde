name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK and native build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Verify native library packaging
        run: python3 tools/verify_native_apk.py app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: onde-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onde-validation
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
